services:
  - type: web
    name: surveyluhh-api
    runtime: python
    runtimeVersion: 3.12
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-url.vercel.app
        sync: false
